<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jan Engels</title>
<meta name="description" content="Jan Engels uit Borne: over water en bodem, duurzaamheid, geestelijke rijkdom, brede welvaart en zijn eigen reis.">
<meta name="theme-color" content="#0b100f">
<meta property="og:type" content="website">
<meta property="og:title" content="Jan Engels">
<meta property="og:description" content="Over water en bodem, duurzaamheid, geestelijke rijkdom, brede welvaart en mijn eigen reis.">
<meta property="og:url" content="https://janengels.earth/">
<meta property="og:locale" content="nl_NL">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one deliberate dark world. Type: Sora (headings) + Source Sans 3 (text). Home = embossed name over a lit, slightly convex shield on a near-black stage. Inner pages = one top bar (home mark, name, five colour-keyed sections) above a hero band in the colour of the current section. */
:root {
  color-scheme: dark;
  --ground: #0b100f;
  --stage: #18211f;
  --ink: #e8ebe6;
  --muted: #9ba7a2;
  --rule: #252f2d;
  --panel: #131b1a;
  --sinopel: #1c5f57;
  --or: #efb92c;
  --azuur: #2747a8;
  --gules: #b42b3c;
  --or-line: #f0c93a;
  --eik: #57521a;
  --oak-oak-dark: #1c300a;
  --oak-bark: #433e0c;
  --oak-bark-lt: #645f2d;
  --oak-leaf-dk: #014816;
  --oak-leaf: #286e32;
  --oak-leaf-md: #64a548;
  --oak-leaf-lt: #9dbe8c;
  --oak-vein: #d7eecd;
  --part: var(--ink);
  --part-ink: #ffffff;
  --part-2: transparent;
  --display: "Sora", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
}
[data-part="duurzaamheid"] { --part: var(--sinopel); }
[data-part="water"]        { --part: var(--azuur); }
[data-part="rijkdom"]      { --part: var(--or); --part-ink: #241c05; }
[data-part="economie"]     { --part: var(--eik); --part-2: var(--or); }
[data-part="reis"]         { --part: var(--gules); --part-2: var(--or-line); }
body {
  --part-text: color-mix(in srgb, var(--part) 55%, #fff);
  --part-tint: color-mix(in srgb, var(--part) 16%, var(--ground));
  background: var(--ground); color: var(--ink);
  font-family: var(--body); font-size: 18px; line-height: 1.6;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
a { color: inherit; }
a:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--or-line); outline-offset: 3px; border-radius: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; }
.narrow { max-width: 38em; }

/* ---------- home: the stage ---------- */
#view-home { background: radial-gradient(ellipse 60% 55% at 50% 52%, var(--stage) 0%, var(--ground) 70%); }
.home { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: center; gap: clamp(20px, 4vh, 40px); min-height: 100svh; padding-block: 28px; }
.home h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(1.6rem, 4vw, 2.5rem); line-height: 1.2; text-align: center; text-transform: uppercase; letter-spacing: .22em; padding-left: .22em; }
.home h1 a { text-decoration: none; display: inline-block;
  /* raised, slightly metallic letters: light from above */
  background: linear-gradient(180deg, #faf8f1 0%, #d9d5c9 48%, #a29e92 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 -1px 0 rgba(255,255,255,.18)) drop-shadow(0 2px 1px rgba(0,0,0,.9)) drop-shadow(0 6px 14px rgba(0,0,0,.6)); }
.home h1 a:hover { background-image: linear-gradient(180deg, #fff4c9 0%, #f0c93a 55%, #a87f12 100%); }
.shield-box { position: relative; width: min(100%, 540px, calc((100svh - 200px) * .833)); min-width: min(100%, 260px); }
svg.shield { width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 22px 34px rgba(0,0,0,.75)) drop-shadow(0 2px 3px rgba(0,0,0,.8)); -webkit-tap-highlight-color: transparent; }
.rl { display: none; }
:root[data-relief="bol"] .rl-bol, :root[data-relief="hout"] .rl-hout, :root[data-relief="facet"] .rl-facet { display: inline; }
svg.shield .side { filter: brightness(.4) saturate(.8); }
:root[data-relief="hout"] svg.shield { filter: drop-shadow(0 20px 26px rgba(0,0,0,.8)); }
:root[data-relief="facet"] svg.shield { filter: drop-shadow(0 16px 24px rgba(0,0,0,.75)); }
:root[data-relief="muur"] svg.shield { filter: drop-shadow(16px 26px 18px rgba(0,0,0,.85)) drop-shadow(2px 3px 2px rgba(0,0,0,.6)); }
svg.shield .region { cursor: pointer; transition: filter .45s ease; }
svg.shield .region:focus { outline: none; }
svg.shield[data-active] .region:not(.is-active) { filter: saturate(.5) brightness(.6); }
svg.shield .region.is-active { filter: brightness(1.14) saturate(1.06); }
/* game-style attention cycle: one part at a time breathes light, no label */
svg.shield .region.pulse { animation: breathe 1.6s ease-in-out; }
svg.shield .region.pulse.charge { animation-name: breathe-charge; }
@keyframes breathe { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35) saturate(1.1); } }
@keyframes breathe-charge { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3) drop-shadow(0 0 10px rgba(240, 201, 58, .85)); } }
svg.shield .hit { fill: transparent; }
svg.shield .ph-hit { fill: none; stroke: transparent; stroke-width: 18; stroke-linejoin: round; pointer-events: stroke; }
svg.shield .ring { fill: none; stroke: var(--or-line); stroke-width: 4; stroke-dasharray: 8 7; opacity: 0; pointer-events: none; }
svg.shield .region:focus-visible .ring { opacity: 1; }
.tag { position: absolute; transform: translate(-50%, -50%); pointer-events: none; background: #f3f1ea; color: #1a201f; border-radius: 999px; padding: 6px 14px; font-family: var(--display); font-size: .92rem; font-weight: 600; line-height: 1.25; text-align: center; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.6); opacity: 0; transition: opacity .2s ease; }
.tag.on { opacity: 1; }
.tag small { display: block; font-family: var(--body); font-weight: 400; font-size: .76rem; color: #4d5754; }

/* ---------- inner pages: one top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--ground) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.bar .wrap { display: flex; align-items: flex-end; gap: 10px 28px; padding-block: 10px 0; flex-wrap: wrap; }
.idn { display: flex; align-items: center; gap: 14px; padding-bottom: 10px; }
.homemark { width: 34px; display: block; transition: transform .2s ease; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
.homemark:hover { transform: translateY(-1px) scale(1.04); }
.homemark svg { width: 100%; height: auto; display: block; }
.idn .name { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .16em; text-decoration: none; font-size: .95rem; }
.idn .name:hover { color: var(--or-line); }
nav.sections { margin-left: auto; display: flex; gap: 4px 22px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
nav.sections::-webkit-scrollbar { display: none; }
nav.sections a { --c: var(--ink); white-space: nowrap; text-decoration: none; font-family: var(--display); font-size: .9rem; font-weight: 500; color: var(--muted); padding-block: 4px 13px; border-bottom: 3px solid color-mix(in srgb, var(--c) 35%, transparent); }
nav.sections a:hover { color: var(--ink); border-bottom-color: color-mix(in srgb, var(--c) 75%, transparent); }
nav.sections a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--c); }
nav.sections a[data-key="duurzaamheid"] { --c: var(--sinopel); }
nav.sections a[data-key="water"] { --c: var(--azuur); }
nav.sections a[data-key="rijkdom"] { --c: var(--or); }
nav.sections a[data-key="economie"] { --c: #8d8531; }
nav.sections a[data-key="reis"] { --c: var(--gules); }

#view-inner { min-height: 100svh; }
.hero { padding-block: 48px 44px; position: relative; overflow: hidden; }
.hero .wrap { position: relative; }
.hero .copy { position: relative; z-index: 1; max-width: 36em; }
.hero-art { position: absolute; pointer-events: none; }
.hero-art svg { display: block; width: 100%; height: auto; }
.has-part[data-part="economie"] .hero, .has-part[data-part="reis"] .hero { min-height: 340px; display: flex; align-items: center; }
.hero > .wrap { width: 100%; }
/* A (voorstel): the charge in full colour on the field it stands on in the shield */
:root[data-art="beeld"] .has-part[data-part="economie"] .hero { background: var(--or); color: #241c05; }
:root[data-art="beeld"] .has-part[data-part="reis"] .hero { background: var(--sinopel); }
:root[data-art="beeld"] .hero-art.oak { right: 0; bottom: -44px; width: min(36%, 300px); }
:root[data-art="beeld"] .hero-art.phoenix { right: 6%; top: -36px; bottom: -36px; width: min(24%, 200px); }
:root[data-art="beeld"] .hero-art.phoenix svg { height: 100%; width: auto; margin-left: auto; }
:root[data-art="beeld"] .has-part[data-part="economie"] .hero { border-bottom-color: var(--eik); }
/* B: watermark of the charge on the band in its own colour */
:root[data-art="watermerk"] .hero-art { right: -2%; top: 50%; transform: translateY(-50%); opacity: .16; filter: brightness(0) invert(1); }
:root[data-art="watermerk"] .hero-art.oak { width: min(46%, 440px); }
:root[data-art="watermerk"] .hero-art.phoenix { width: min(20%, 170px); right: 6%; }
@media (max-width: 700px) {
  .has-part[data-part="economie"] .hero, .has-part[data-part="reis"] .hero { min-height: 0; }
  :root[data-art] .hero-art { opacity: .22; }
  :root[data-art="beeld"] .hero-art.oak { width: 58%; right: -14%; }
  :root[data-art="beeld"] .hero-art.phoenix { width: 40%; right: -6%; }
}
.eyebrow { margin: 0 0 8px; font-family: var(--display); font-size: .78rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.hero h2 { margin: 0 0 14px; font-family: var(--display); font-weight: 600; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.1; letter-spacing: -.01em; text-wrap: balance; }
.lede { margin: 0; font-size: 1.15rem; max-width: 34em; }
.concept { display: inline-block; margin-top: 14px; font-family: var(--display); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 3px; padding: 1px 6px; opacity: .65; }

.content { padding-block: 36px 64px; display: grid; gap: 40px; }
.content h3 { margin: 0 0 12px; font-family: var(--display); font-weight: 600; font-size: 1.2rem; }
.plan { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 28px; }
.plan li { border-top: 2px solid var(--rule); padding-block: 12px 18px; }
.plan b { display: block; font-family: var(--display); font-weight: 600; }
.plan span { color: var(--muted); font-size: .95rem; }
.empty { border: 1px dashed var(--rule); border-radius: 6px; padding: 18px 20px; color: var(--muted); }
.duo { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 28px; align-items: start; }
.portrait { aspect-ratio: 4 / 5; max-width: 100%; border-radius: 6px; background: var(--panel); border: 1px solid var(--rule); display: grid; place-items: center; text-align: center; color: var(--muted); font-size: .85rem; }
.portrait b { display: block; font-family: var(--display); font-size: 2.4rem; font-weight: 500; color: var(--ink); letter-spacing: .06em; }
.layers { display: grid; gap: 22px; }
.layer { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 18px; border-top: 1px solid var(--rule); padding-top: 14px; }
.layer > p { margin: 0; font-family: var(--display); font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.layer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.layer a.part { font-family: var(--display); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
.layer a.part i { width: 12px; height: 12px; border-radius: 2px; background: var(--sw); flex: none; }
.layer a.part:hover { text-decoration: underline; }
.layer small { display: block; color: var(--muted); font-size: .92rem; padding-left: 22px; }
.contact { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 20px 22px; }
.contact p { margin: 0 0 6px; }
#contact { scroll-margin-top: 120px; }
.cform { display: grid; gap: 14px; margin-top: 16px; }
.cform .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cform label { display: grid; gap: 5px; font-family: var(--display); font-size: .82rem; font-weight: 500; color: var(--muted); }
.cform input, .cform select, .cform textarea { font: inherit; font-family: var(--body); font-size: 1rem; color: var(--ink); background: var(--ground); border: 1px solid var(--rule); border-radius: 5px; padding: 9px 11px; width: 100%; }
.cform textarea { min-height: 130px; resize: vertical; }
.cform input:focus, .cform select:focus, .cform textarea:focus { outline: 2px solid var(--or-line); outline-offset: 1px; border-color: transparent; }
.cform .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.cform button { justify-self: start; font-family: var(--display); font-weight: 600; font-size: .95rem; background: var(--or); color: #241c05; border: 0; border-radius: 5px; padding: 11px 20px; cursor: pointer; }
.cform button:hover { background: var(--or-line); }
.cform .fine { font-size: .85rem; color: var(--muted); margin: 0; }
.cform .fine a { color: var(--ink); }
.prose { max-width: 38em; display: grid; gap: 14px; }
.prose h3 { margin: 18px 0 0; }
.prose p, .prose ul { margin: 0; }
.prose ul { padding-left: 1.2em; display: grid; gap: 6px; }
.foot { border-top: 1px solid var(--rule); color: var(--muted); font-size: .85rem; }
.foot .wrap { padding-block: 18px; display: flex; flex-wrap: wrap; gap: 6px 20px; }
.foot a { color: var(--muted); }
.foot a:hover { color: var(--ink); }
@media (max-width: 700px) { .cform .row { grid-template-columns: minmax(0, 1fr); } }

/* variant A: banier */
:root[data-variant="A"] .has-part .hero { background: var(--part); color: var(--part-ink); border-bottom: 5px solid var(--part-2); }
:root[data-variant="A"] .has-part .hero .eyebrow { color: inherit; opacity: .78; }
/* variant B: rand */
:root[data-variant="B"] .has-part::before { content: ""; position: fixed; inset: 0 auto 0 0; width: 9px; background: var(--part); box-shadow: 4px 0 0 var(--part-2); z-index: 11; }
:root[data-variant="B"] .has-part .hero h2 { color: var(--part-text); }
:root[data-variant="B"] .has-part .hero { border-bottom: 2px solid var(--part); }
/* variant C: tint */
:root[data-variant="C"] .has-part { background: var(--part-tint); }
:root[data-variant="C"] .has-part .bar { background: color-mix(in srgb, var(--part-tint) 92%, transparent); }
:root[data-variant="C"] .has-part .hero h2 { color: var(--part-text); }

@media (max-width: 700px) {
  body { font-size: 17px; }
  .bar .wrap { padding-inline: 0; }
  .idn { padding-inline: 20px; padding-bottom: 6px; }
  nav.sections { margin-left: 0; width: 100%; padding-inline: 20px; gap: 4px 20px; mask-image: linear-gradient(90deg, #000 85%, transparent); }
  .duo { grid-template-columns: minmax(0, 1fr); }
  .duo .portrait { width: 160px; }
  .layer { grid-template-columns: minmax(0, 1fr); gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { svg.shield .region, .tag { transition: none; } svg.shield .region.pulse { animation: none; } }
</style>
</head>

        </a>

<script>
const PARTS = [
  { key: "water", name: "Water & bodem", field: "Azuur", layer: "Aarde", sw: "var(--azuur)",
    lede: "Rentmeester van water en bodem. Ik richt me op het werk van het waterschap: schoon en voldoende water, veilige dijken en een bodem die leeft. Biodiversiteit hoort daarbij.",

    blog: "Blogs over water en bodem verschijnen hier, met de nieuwste bovenaan." },
  { key: "duurzaamheid", name: "Duurzaamheid", field: "Sinopel", layer: "Aarde", sw: "var(--sinopel)",
    lede: "De energietransitie voorop: van, voor en door inwoners. Ik ben actief in energiecoöperaties, lokaal en provinciaal. Verduurzaming van de gebouwde omgeving hoort erbij.",
    plan: [["Energietransitie", "Waarom inwoners eigenaar moeten zijn van hun energie."], ["Energiecoöperaties", "Waar ik actief ben, en wat coöperaties doen."], ["Gebouwde omgeving", "Woningen en gebouwen verduurzamen."], ["Blog", "Berichten over energie en duurzaamheid."]],
    blog: "Blogs over de energietransitie verschijnen hier, met de nieuwste bovenaan." },
  { key: "rijkdom", name: "Geestelijke rijkdom", field: "Goud", layer: "Samenleving", sw: "var(--or)",
    lede: "Cultuur, literatuur en muziek maken: ik speel trombone in twee harmonieorkesten en een bigband. En het gesprek: elkaar echt ontmoeten, ook in de politiek.",
    plan: [["Muziek", "De orkesten, de bigband, en foto's van optredens."], ["Lezen en cultuur", "Wat ik lees en wat me raakt."], ["Ontmoeting", "Waarom het gesprek ertoe doet, ook in de politiek."], ["Kom in gesprek", "Op afspraak: via het formulier op de pagina achter mijn naam."]] },
  { key: "economie", art: "oak", name: "Brede welvaart", field: "De eik", layer: "Economie", sw: "#8d8531",
    lede: "De aarde is de basis. De samenleving werkt binnen de grenzen van de aarde, de economie binnen die van de samenleving. In de eik zie je die lagen terug: wortels in de aarde, een stevige stam, en vruchten.",
    plan: [["Mijn kijk: de wedding cake", "Het model achter deze site, kort uitgelegd."], ["Economie binnen grenzen", "Welvaart die verder kijkt dan geld."], ["Wat dit vraagt van bestuur", "Hoe je keuzes maakt met dit model in je achterhoofd."]] },
  { key: "reis", art: "phoenix", name: "Mijn reis", field: "De feniks", layer: "Persoonlijk", sw: "var(--gules)",
    lede: "Na een burn-out ben ik uit mijn eigen as herrezen. Dat was geen breuk, maar het begin van een nieuwe fase. Ik wil de wereld open, nieuwsgierig en onbevreesd tegemoet treden.",
    plan: [["Mijn verhaal", "Van burn-out naar een nieuwe fase."], ["Loopbaan", "De hoofdlijnen; details staan op LinkedIn."], ["Nevenfuncties", "Een actueel en openbaar overzicht."]],
    portrait: true },
];
const byKey = Object.fromEntries(PARTS.map(p => [p.key, p]));
const LAYERS = [["Aarde", ["water", "duurzaamheid"]], ["Samenleving", ["rijkdom"]], ["Economie", ["economie"]], ["Persoonlijk", ["reis"]]];


const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const sess = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} } };

// ---------- inner pages ----------
function planList(p) { return `<ul class="plan">${p.plan.map(([t, d]) => `<li><b>${t}</b><span>${d}</span></li>`).join("")}</ul>`; }
document.getElementById("pages").innerHTML = PARTS.map(p => `
  <article id="view-${p.key}" hidden>
    <div class="hero"><div class="wrap">
      ${p.art ? `<div class="hero-art ${p.art}" aria-hidden="true">${p.art === "oak"
        ? '<svg viewBox="565 70 450 490"><use href="#oakArt"/></svg>'
        : '<svg viewBox="80 52 400 1004"><use href="#phoenixArt"/></svg>'}</div>` : ""}
      <div class="copy">
        <p class="eyebrow">${p.field} · ${p.layer}</p>
        <h2>${p.name}</h2>
        <p class="lede">${p.lede}</p>
        <span class="concept">Concepttekst</span>
      </div>
    </div></div>
    <div class="wrap content">
      ${p.portrait ? `<div class="duo"><div class="portrait"><div><b>JE</b>Portretfoto volgt</div></div><div><h3>Hier komt</h3>${planList(p)}</div></div>` : `<section><h3>Hier komt</h3>${planList(p)}</section>`}
      ${p.blog ? `<section class="narrow"><h3>Blog</h3><div class="empty">Nog geen berichten. ${p.blog}</div></section>` : ""}
    </div>
  </article>`).join("") + `
  <article id="view-jan" hidden>
    <div class="hero"><div class="wrap">
      <p class="eyebrow">Over deze site</p>
      <h2>Jan Engels</h2>
      <p class="lede">Ik woon in Borne. Ik werkte in finance &amp; control, was wethouder in Bronckhorst en in Losser, en ben opgeleid als rentmeester. Op deze site laat ik zien wat ik belangrijk vind, en hoe dat samenhangt.</p>
      <span class="concept">Concepttekst</span>
    </div></div>
    <div class="wrap content">
      <div class="duo">
        <div class="portrait"><div><b>JE</b>Portretfoto volgt</div></div>
        <div class="contact narrow" id="contact">
          <h3>Kom in gesprek</h3>
          <p>Ik maak graag een afspraak voor een goed gesprek. Laat hieronder weten waarover, en wanneer het je uitkomt.</p>
          <form class="cform" action="https://www.formpost.eu/f/29dc551c" method="POST">
            <div class="row">
              <label for="f-naam">Naam<input id="f-naam" type="text" name="naam" autocomplete="name" required></label>
              <label for="f-email">E-mailadres<input id="f-email" type="email" name="email" autocomplete="email" required></label>
            </div>
            <div class="row">
              <label for="f-onderwerp">Onderwerp
                <select id="f-onderwerp" name="onderwerp">
                  <option>Water &amp; bodem</option><option>Duurzaamheid</option><option>Muziek en cultuur</option><option>Brede welvaart</option><option>Iets anders</option>
                </select>
              </label>
              <label for="f-moment">Voorkeur voor dag of tijd<input id="f-moment" type="text" name="moment" placeholder="Bijvoorbeeld: dinsdagmiddag"></label>
            </div>
            <label for="f-bericht">Bericht<textarea id="f-bericht" name="message" required></textarea></label>
            <div class="hp" aria-hidden="true"><label for="f-gotcha">Laat dit veld leeg<input id="f-gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
            <button type="submit">Verstuur</button>
            <p class="fine">Je gegevens gebruik ik alleen om op je bericht te reageren. Lees de <a href="#privacy">privacyverklaring</a>.</p>
          </form>
        </div>
      </div>
      <section>
        <h3>De site in één oogopslag</h3>
        <p class="narrow" style="margin:0 0 18px;color:var(--muted)">Het schild volgt de lagen van de wedding cake: de aarde als basis, daarop de samenleving, daarbinnen de economie. De feniks is mijn eigen weg erdoorheen.</p>
        <div class="layers">${LAYERS.map(([layer, keys]) => `
          <div class="layer"><p>${layer}</p><ul>${keys.map(k => { const p = byKey[k]; return `
            <li><a class="part" href="#${k}" style="--sw:${p.sw}"><i></i>${p.name}</a><small>${p.plan.map(x => x[0]).join(" · ")}</small></li>`; }).join("")}</ul></div>`).join("")}
        </div>
      </section>
    </div>
  </article>
  <article id="view-bedankt" hidden>
    <div class="hero"><div class="wrap"><div class="copy">
      <p class="eyebrow">Bericht ontvangen</p>
      <h2>Dank je wel</h2>
      <p class="lede">Je bericht is verstuurd. Ik neem zo snel mogelijk contact met je op.</p>
    </div></div></div>
    <div class="wrap content"><p><a href="#home">← Terug naar het schild</a></p></div>
  </article>
  <article id="view-privacy" hidden>
    <div class="hero"><div class="wrap"><div class="copy">
      <p class="eyebrow">Privacyverklaring</p>
      <h2>Wat ik met je gegevens doe</h2>
      <p class="lede">Kort gezegd: zo weinig mogelijk. Deze site gebruikt geen cookies en houdt niet bij wat je bekijkt.</p>
      <span class="concept">Concepttekst</span>
    </div></div></div>
    <div class="wrap content"><div class="prose">
      <h3>Wie ben ik</h3>
      <p>Deze site is van Jan Engels, Borne. Ik ben verantwoordelijk voor de gegevens die je via deze site met mij deelt.</p>
      <h3>Welke gegevens</h3>
      <p>Alleen wat je zelf invult in het contactformulier: je naam, je e-mailadres, het onderwerp, je voorkeur voor een moment en je bericht.</p>
      <h3>Waarvoor</h3>
      <p>Om op je bericht te reageren en, als je dat wilt, een afspraak te maken. Ik gebruik je gegevens niet voor iets anders en geef ze niet door aan anderen.</p>
      <h3>Wie helpen mij daarbij</h3>
      <ul>
        <li>FormPost (Duitsland) verwerkt het formulier en stuurt je bericht naar mij door.</li>
        <li>mailbox.org (Duitsland) beheert mijn e-mail.</li>
        <li>statichost.eu (Zweden) host deze website.</li>
      </ul>
      <p>Alle drie bewaren gegevens binnen de Europese Unie.</p>
      <p>De lettertypes van deze site worden nu nog geladen via Google Fonts. Daarbij ziet Google je IP-adres. Binnenkort zet ik de lettertypes op de site zelf, zodat dat niet meer gebeurt.</p>
      <h3>Hoe lang</h3>
      <p>Niet langer dan nodig om je vraag af te handelen.</p>
      <h3>Jouw rechten</h3>
      <p>Je kunt me vragen welke gegevens ik van je heb, en vragen die te laten verwijderen. Gebruik daarvoor het <a href="#contact">contactformulier</a>. Ben je het niet eens met hoe ik met je gegevens omga, dan kun je een klacht indienen bij de Autoriteit Persoonsgegevens.</p>
    </div></div>
  </article>`;

// ---------- open design choice ----------
document.documentElement.dataset.variant = "A";
document.documentElement.dataset.art = "beeld";
document.documentElement.dataset.relief = "hout";

// ---------- home shield ----------
// Mouse (desktop): pointing shows the name, a click opens. Touch (phone, tablet): first tap shows the name, second tap opens.
// On every device: until a part has been chosen, the parts take turns to light up, without labels, like selectable items in a game.
const svg = document.querySelector("svg.shield");
const tag = document.getElementById("tag");
const regions = [...svg.querySelectorAll(".region")];
const TAGPOS = { water: [74, 71], duurzaamheid: [30, 79], rijkdom: [74, 46], economie: [74, 24], reis: [28, 42] };
const ORDER = ["water", "duurzaamheid", "rijkdom", "economie", "reis"];
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let shown = null, lastPointer = "mouse", hovering = false, cycleI = 0, chosen = !!sess.get("je-chosen");
function show(key, touch) {
  shown = key;
  regions.forEach(r => r.classList.toggle("is-active", r.dataset.key === key));
  if (key) {
    regions.forEach(r => r.classList.remove("pulse"));
    svg.dataset.active = key;
    const [x, y] = TAGPOS[key];
    tag.style.left = x + "%"; tag.style.top = y + "%";
    tag.innerHTML = byKey[key].name + (touch ? "<small>Tik nogmaals om te openen</small>" : "");
    tag.classList.add("on");
  } else {
    delete svg.dataset.active;
    tag.classList.remove("on");
  }
}
function tick() {
  if (chosen || reduced || shown || hovering || document.getElementById("view-home").hidden) return;
  const key = ORDER[cycleI++ % ORDER.length];
  const r = regions.find(x => x.dataset.key === key);
  regions.forEach(x => x.classList.remove("pulse"));
  void r.getBoundingClientRect();
  r.classList.add("pulse");
}
setInterval(tick, 1700);
document.addEventListener("pointerdown", e => {
  lastPointer = e.pointerType || "mouse";
  if (!e.target.closest || !e.target.closest("svg.shield .region")) { if (shown && lastPointer !== "mouse") show(null); }
}, true);
svg.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") hovering = true; });
svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { hovering = false; show(null); } });
regions.forEach(r => {
  const key = r.dataset.key;
  r.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") show(key, false); });
  r.addEventListener("focus", () => show(key, false));
  r.addEventListener("blur", () => show(null));
  r.addEventListener("click", e => {
    if (lastPointer !== "mouse" && shown !== key) { e.preventDefault(); show(key, true); return; }
    chosen = true; sess.set("je-chosen", "1");
  });
});

// ---------- routing ----------
function route() {
  const h = location.hash.slice(1);
  const EXTRA = { jan: "Over Jan Engels", bedankt: "Dank je wel", privacy: "Privacy" };
  const wantsForm = h === "contact";
  const page = byKey[h] || EXTRA[h] ? h : wantsForm ? "jan" : "home";
  const inner = page !== "home";
  document.getElementById("view-home").hidden = page !== "home";
  const innerEl = document.getElementById("view-inner");
  innerEl.hidden = !inner;
  document.querySelectorAll("#pages > article").forEach(a => a.hidden = a.id !== "view-" + page);
  const part = byKey[page] ? page : "";
  innerEl.dataset.part = part;
  innerEl.classList.toggle("has-part", !!part);
  document.body.dataset.part = part;
  document.querySelectorAll("nav.sections a").forEach(a => a.dataset.key === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const cur = document.querySelector('nav.sections a[aria-current="page"]');
  if (cur) cur.scrollIntoView({ block: "nearest", inline: "center" });
  document.title = page === "home" ? "Jan Engels" : page === "jan" ? EXTRA.jan : (byKey[page] ? byKey[page].name : EXTRA[page]) + " · Jan Engels";
  show(null);
  if (wantsForm) document.getElementById("contact").scrollIntoView({ block: "start" });
  else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
