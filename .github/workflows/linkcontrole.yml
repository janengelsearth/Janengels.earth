# Controleert elke maand alle links op de site.
# Werkt een link niet meer, dan verschijnt er een issue "Kapotte links" met de lijst.
name: Linkcontrole

on:
  schedule:
    - cron: "17 5 1 * *"   # elke 1e van de maand, vroeg in de ochtend (UTC)
  workflow_dispatch:        # handmatig starten via het tabblad Actions
  push:
    branches: [main]
    paths: [index.html]

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Links controleren
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200..299,429,999
            --exclude "linkedin\.com"
            --exclude "^mailto:"
            index.html
          output: lychee/rapport.md
          fail: false

      - name: Issue aanmaken of bijwerken bij kapotte links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Kapotte links
          content-filepath: lychee/rapport.md
          labels: link-rot
